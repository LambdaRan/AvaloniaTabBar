name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0), leave empty for CI build'
        required: false

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AvaloniaTabBar.slnx

      # 版本参数必须喂给 build，不能只喂 pack：pack 带 --no-build，包里的
      # DLL 就是这一步 build 出来的那一个 —— 只给 pack 传 -p:Version 只会改
      # nuspec 的版本号，程序集里仍是 VersionPrefix（0.3.1 包里的 DLL 写着
      # 0.2.0 就是这么来的）。两步用同一套参数，包与程序集才不会分家。
      - name: Build
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            dotnet build AvaloniaTabBar.slnx -c Release --no-restore -p:Version=${{ inputs.version }}
          else
            dotnet build AvaloniaTabBar.slnx -c Release --no-restore -p:VersionSuffix=ci.${{ github.run_number }}
          fi

      # The test suite is the gate for the pack step below; without it a broken
      # control library would still be published as a package.
      - name: Test
        run: dotnet test SimTabBar.Tests/SimTabBar.Tests.csproj -c Release --no-build

      - name: Pack SimTabBar
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            dotnet pack SimTabBar/SimTabBar.csproj -c Release --no-build -p:Version=${{ inputs.version }}
          else
            dotnet pack SimTabBar/SimTabBar.csproj -c Release --no-build -p:VersionSuffix=ci.${{ github.run_number }}
          fi

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages
          path: SimTabBar/bin/Release/*.nupkg

  # NativeAOT 守卫：库必须能被 PublishAot 的消费方引用。
  # 1) 库工程已开 IsAotCompatible，这里把 IL2026/IL3050/IL2070/IL2075 直接当错误；
  # 2) 真跑一次 PublishAot，保证 clang/原生链接链路也是通的。
  # 运行期冒烟（标签头真的渲染出来）需要有显示环境，本地跑，见 README。
  aot-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install NativeAOT toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Build library with trim/AOT analyzers as errors
        run: >
          dotnet build SimTabBar/SimTabBar.csproj -c Release
          -p:WarningsAsErrors=IL2026%3BIL3050%3BIL2070%3BIL2075%3BIL3053

      - name: NativeAOT publish demo
        run: >
          dotnet publish SimTabBarDemo/SimTabBarDemo.csproj -c Release -r linux-x64
          -p:PublishAot=true -o artifacts/aot
