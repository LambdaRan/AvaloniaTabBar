name: build

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0), leave empty for CI build'
        required: false

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack SimTabBar
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            dotnet pack SimTabBar/SimTabBar.csproj -c Release -p:Version=${{ inputs.version }}
          else
            dotnet pack SimTabBar/SimTabBar.csproj -c Release -p:VersionSuffix=ci.${{ github.run_number }}
          fi

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: SimTabBar/bin/Release/*.nupkg
